[pytest]
testpaths = steps
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# BDD settings
bdd_features_base_dir = features

# Output settings - self-contained HTML report (works offline)
addopts = -v --tb=short --html=reports/report.html --self-contained-html

# Markers
markers =
    playwright: Playwright browser tests
    smoke: Quick smoke tests
    theme: Theme-related tests
    navigation: Navigation tests
    search: Search tests
    api: API documentation tests
    failure: Intentional failure tests
