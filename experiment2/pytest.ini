[pytest]
testpaths = steps
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# BDD settings
bdd_features_base_dir = features

# Output settings - generates Allure results for step-by-step Gherkin reports
addopts = -v --tb=short --alluredir=reports/allure-results --clean-alluredir

# Markers
markers =
    playwright: Playwright browser tests
    smoke: Quick smoke tests
    theme: Theme-related tests
    navigation: Navigation tests
